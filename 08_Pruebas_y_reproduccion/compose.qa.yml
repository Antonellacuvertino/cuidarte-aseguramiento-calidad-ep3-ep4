name: cuidarte-qa-entrega
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: qa_local_synthetic
      POSTGRES_DB: cuidarte_qa
    ports:
      - '127.0.0.1:15443:5432'
    volumes:
      - ../07_Codigo/BACKEND/sql/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U qa -d cuidarte_qa']
      interval: 5s
      retries: 12
  sonar:
    image: sonarqube:9.9-community
    cpus: 1.5
    mem_limit: 2048m
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
      SONAR_WEB_JAVAOPTS: '-Xms128m -Xmx256m'
      SONAR_CE_JAVAOPTS: '-Xms128m -Xmx256m'
    ports:
      - '127.0.0.1:9000:9000'
